<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TarotVoice - 음성파일 관리 시스템</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 TarotVoice 음성파일 관리 시스템</h1>
            <p class="subtitle">음성 파일을 업로드하고 관리하세요</p>
        </header>

        <!-- Statistics Dashboard -->
        <section class="stats-dashboard" id="statsDashboard">
            <div class="stat-card">
                <div class="stat-value" id="totalFiles">0</div>
                <div class="stat-label">총 파일 수</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalSize">0 MB</div>
                <div class="stat-label">총 용량</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalPlays">0</div>
                <div class="stat-label">총 재생 수</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalDownloads">0</div>
                <div class="stat-label">총 다운로드 수</div>
            </div>
        </section>

        <!-- Upload Section -->
        <section class="upload-section">
            <h2>📤 새 음성 파일 업로드</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="audioId">ID *</label>
                    <input type="text" id="audioId" name="id" required
                           placeholder="예: tarot_card_01"
                           pattern="[a-zA-Z0-9_-]+"
                           title="영문, 숫자, 언더스코어(_), 하이픈(-)만 사용 가능합니다">
                    <small>영문, 숫자, 언더스코어(_), 하이픈(-)만 사용 가능</small>
                </div>

                <div class="form-group">
                    <label for="audioTitle">제목 *</label>
                    <input type="text" id="audioTitle" name="title" required
                           placeholder="음성 파일 제목을 입력하세요">
                </div>

                <div class="form-group">
                    <label for="audioDescription">설명</label>
                    <textarea id="audioDescription" name="description" rows="3"
                              placeholder="음성 파일에 대한 설명을 입력하세요 (선택사항)"></textarea>
                </div>

                <div class="form-group">
                    <label for="audioFile">음성 파일 *</label>
                    <input type="file" id="audioFile" name="audio" accept="audio/*" required>
                    <small>지원 형식: MP3, WAV, OGG, M4A, WebM (최대 10MB)</small>
                </div>

                <button type="submit" class="btn btn-primary" id="uploadBtn">
                    <span id="uploadBtnText">업로드</span>
                    <span id="uploadSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>
        </section>

        <!-- Search and Filter Section -->
        <section class="search-section">
            <h2>🔍 음성 파일 목록</h2>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="ID, 제목, 설명으로 검색...">
                <button onclick="loadAudioFiles()" class="btn btn-secondary">검색</button>
                <button onclick="clearSearch()" class="btn btn-secondary">초기화</button>
            </div>
        </section>

        <!-- Audio Files List -->
        <section class="audio-list" id="audioList">
            <!-- Audio files will be loaded here dynamically -->
        </section>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
            <!-- Pagination will be loaded here dynamically -->
        </div>

        <!-- Audio Player Modal -->
        <div id="playerModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closePlayer()">&times;</span>
                <h3 id="playerTitle">Audio Player</h3>
                <audio id="audioPlayer" controls style="width: 100%; margin-top: 20px;">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeEditModal()">&times;</span>
                <h3>음성 파일 정보 수정</h3>
                <form id="editForm">
                    <input type="hidden" id="editId">

                    <div class="form-group">
                        <label for="editTitle">제목</label>
                        <input type="text" id="editTitle" required>
                    </div>

                    <div class="form-group">
                        <label for="editDescription">설명</label>
                        <textarea id="editDescription" rows="3"></textarea>
                    </div>

                    <div class="modal-buttons">
                        <button type="submit" class="btn btn-primary">저장</button>
                        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
